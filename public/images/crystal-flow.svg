<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <defs>
    <linearGradient id="violet-glass" x1="0" y1="0" x2="1" y2="0.7" gradientUnits="objectBoundingBox">
      <stop stop-color="#CCB0E9" stop-opacity="0"/>
      <stop offset=".35" stop-color="#CCB0E9" stop-opacity=".12"/>
      <stop offset=".72" stop-color="#A3A8E5" stop-opacity=".20"/>
      <stop offset=".92" stop-color="#8554BE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#CCB0E9" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="pearl-glass" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#A3C6F0" stop-opacity=".05"/>
      <stop offset=".40" stop-color="#CCB0E9" stop-opacity=".20"/>
      <stop offset=".76" stop-color="#E8DAF5" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFE099" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8554BE" stop-opacity="0"/>
      <stop offset=".4" stop-color="#8554BE" stop-opacity=".19"/>
      <stop offset=".72" stop-color="#A3C6F0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#CCB0E9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".08" stop-color="white"/>
      <stop offset=".85" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1600" height="1400" fill="url(#fade)"/></mask>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <g mask="url(#edges)">
    <!-- Diffused light behind the folds, with the center kept nearly white. -->
    <g filter="url(#haze)" fill="none" stroke-linecap="round">
      <path d="M1430 0C1050 210 1680 335 1500 610S1190 810 1620 1100" stroke="#CCB0E9" stroke-opacity=".12" stroke-width="140"/>
      <path d="M-140 460C280 690 90 850 360 990S590 1150 320 1330" stroke="#A3C6F0" stroke-opacity=".10" stroke-width="110"/>
    </g>
    <!-- Translucent, tapering ribbons rather than repeated outline rings. -->
    <path d="M1600-90C1250 10 1070 174 1220 350C1375 530 1710 503 1550 768C1460 918 1430 1010 1690 1170L1740 880C1480 900 1800 610 1540 438C1290 274 1255 162 1600 80Z" fill="url(#violet-glass)"/>
    <path d="M1650 40C1305 135 1260 250 1450 390C1630 522 1460 667 1380 830C1292 1010 1545 1140 1650 1190L1700 1030C1445 930 1480 867 1560 716C1750 360 1285 388 1410 205C1468 120 1570 102 1650 94Z" fill="url(#pearl-glass)"/>
    <path d="M-100 370C80 510 340 590 220 800C115 982 155 1080 520 1190C680 1238 662 1310 590 1410L358 1450C600 1260 295 1278 102 1162C-180 992 182 830 72 661C18 578-67 540-100 520Z" fill="url(#pearl-glass)"/>
    <path d="M-90 580C195 650 42 890 240 996C405 1085 685 1020 800 1230C848 1318 770 1400 770 1400H625C880 1110 220 1230 102 1000C20 839 170 767-90 680Z" fill="url(#violet-glass)"/>
    <!-- A few soft specular edges give the folds a glass-like surface. -->
    <g fill="none" stroke="url(#rim)" stroke-width="1.2" filter="url(#soft)">
      <path d="M1600-90C1250 10 1070 174 1220 350C1375 530 1710 503 1550 768C1460 918 1430 1010 1690 1170"/>
      <path d="M-100 370C80 510 340 590 220 800C115 982 155 1080 520 1190C680 1238 662 1310 590 1410"/>
      <path d="M-90 580C195 650 42 890 240 996C405 1085 685 1020 800 1230"/>
    </g>
  </g>
</svg>
